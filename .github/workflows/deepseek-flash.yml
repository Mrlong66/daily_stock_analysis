      #   if: always()
      #   env:
      #     KEY: ${{ secrets.SERVERCHAN_KEY }}
      #     REPLY: ${{ steps.call.outputs.reply }}
      #   run: |
      #     curl -sS "https://sctapi.ftqq.com/${KEY}.send" \
      #       --data-urlencode "title=DeepSeek测试${{ job.status }}" \
      #       --data-urlencode "desp=$REPLY"

      # ③ Bark(iOS)—— 需要 Secret: BARK_KEY
