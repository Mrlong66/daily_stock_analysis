name: DeepSeek-V4-Flash Test

on:
  workflow_dispatch:

jobs:
  call-model:
    runs-on: ubuntu-latest
    steps:
      - name: 调用模型
        id: call
        env:
          EDGEFN_API_KEY: ${{ secrets.EDGEFN_API_KEY }}
        run: |
          RESP=$(curl -sS https://api.edgefn.net/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $EDGEFN_API_KEY" \
            -d '{"model":"DeepSeek-V4-Flash","messages":[{"role":"user","content":"你好,一句话介绍自己"}],"max_tokens":100}')
          echo "$RESP"
          # 提取模型回复内容,失败时给出原文
          CONTENT=$(echo "$RESP" | jq -r '.choices[0].message.content // ("调用失败:" + tostring)')
          echo "reply=$CONTENT" >> $GITHUB_OUTPUT

      # ========== 通知渠道(选一个,删掉其他的)==========
      # ① 企业微信
      - name: 企业微信通知
        if: always()
        env:
          WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          REPLY: ${{ steps.call.outputs.reply }}
        run: |
          PAYLOAD=$(jq -n --arg c "DeepSeek测试结果:
状态:${{ job.status }}
回复:$REPLY" '{"msgtype":"text","text":{"content":$c}}')
          curl -sS "$WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"

      # ② 微信(Server酱)—— 需要 Secret: SERVERCHAN_KEY
